<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevo Enfermería · Hab. 2301-2316</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="imagen.png">
<style>
  :root{
    --azul: #1c4e73;
    --azul-claro: #eaf1f6;
    --p-color: #2f6690;
    --v-color: #9c5b1f;
    --gris-borde: #cfd8de;
    --fondo: #f6f8f9;
    --texto: #1a2733;
    --ok: #2f7d4f;
    /* Suma exacta de las 5 columnas: 78px + 32px + 32px + 224px + 100px = 466px */
    --sheets-cell-width: 466px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
  }
  header{
    background: var(--azul);
    color:#fff;
    padding: 14px 16px;
    position: sticky; top:0; z-index: 10;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap;
  }
  header h1{ font-size:1.05rem; margin:0; font-weight:700; letter-spacing:.2px;}
  header .sub{font-size:.75rem; opacity:.85;}
  .toolbar{
    display:flex; gap:8px; padding:10px 16px; background:#fff;
    border-bottom:1px solid var(--gris-borde); flex-wrap:wrap; align-items:center;
    position: sticky; top:56px; z-index:9;
  }
  button, select.btn-select{
    font: inherit; border:1px solid var(--gris-borde); background:#fff;
    padding:8px 12px; border-radius:8px; cursor:pointer; color:var(--texto);
  }
  button.primary{ background:var(--azul); color:#fff; border-color:var(--azul);}
  #status{ font-size:.8rem; color:#647485; margin-left:auto;}
  #status.saving{color:#b4790f;}
  #status.ok{color:var(--ok);}
  #status.err{color:#b3261e;}

  main{ padding: 10px 12px 60px; max-width: 1000px; margin: 0 auto; }

  .room{
    background:#fff; border:1px solid var(--gris-borde); border-radius:12px;
    margin: 12px auto; overflow:hidden; width: fit-content; max-width: 100%;
  }
  .room-head{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; background:var(--azul-claro); border-bottom:1px solid var(--gris-borde);
  }
  .room-head label{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:.95rem; cursor:pointer;}
  
  .beds{ 
    display:flex; 
    flex-wrap:wrap;
    justify-content:center;
  }
  
  .bed{ 
    padding:10px 12px; 
    width: var(--sheets-cell-width);
    box-sizing: border-box;
  }
  .bed + .bed{ border-left:1px solid var(--gris-borde); }
  @media (max-width: 960px){ 
    .bed + .bed{ border-left:none; border-top:1px solid var(--gris-borde);} 
  }

  .bed-title{
    font-weight:700; font-size:.95rem; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
  }
  .bed-title .bed-number{ display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .bed-title .header-nombre-box{ flex:1; margin:0 4px; }
  .bed-title .especialidad-select{
    width:auto; max-width:110px; padding:4px 6px; font-size:.78rem;
  }
  .bed-title .tag{
    font-size:.65rem; padding:2px 6px; border-radius:999px; color:#fff;
  }
  .bed.P .tag{ background: var(--p-color); }
  .bed.V .tag{ background: var(--v-color); }

  .field{ margin-bottom:8px; width: 100%; }
  .field label{ display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; color:#647485; margin-bottom:2px;}
  .field input, .field select, .rich-field{
    width:100%; border:1px solid var(--gris-borde); border-radius:6px; padding:6px 8px;
    font: inherit; font-size:.88rem; background:#fdfdfd;
  }

  .rich-field{
    width: 100%;
    white-space:pre-wrap; word-break:break-word; outline:none;
    line-height:1.25; font-size:13px; font-family: Arial, sans-serif;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
  }

  .rich-field.inline-name{ min-height:28px; height:28px; padding:4px 6px; }
  .rich-field.field-jc{ min-height:42px; height:42px; }
  .rich-field.field-ap{ min-height:75px; height:75px; }
  .rich-field.field-pte{ min-height:75px; height:75px; }
  .rich-field.field-otros{ min-height:75px; height:75px; }

  .rich-field:focus{ border-color: var(--azul); background:#fff; }

  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  
  .sv-row{ display:flex; flex-direction:row; align-items:center; justify-content:space-around; gap:8px; width:100%; margin-top: 4px; }
  .sv-group{ display:flex; flex-direction:row; align-items:center; gap:4px; }
  .sv-check{
    display:flex; align-items:center; justify-content:center; gap:3px; font-size:.75rem; color:#647485;
    white-space:nowrap; cursor:pointer;
  }
  .sv-check input[type="checkbox"]{
    width:16px; height:16px; margin:0; accent-color: var(--azul); cursor:pointer;
  }
  .date-input{ width:70px !important; text-align:center; padding:3px !important; font-size:.8rem !important; }

  /* Pantalla PIN */
  #lockScreen{
    position:fixed; inset:0; background:var(--azul);
    display:flex; align-items:center; justify-content:center; z-index:100;
    padding:20px;
  }
  #lockScreen.hidden{ display:none; }
  .lock-box{
    background:#fff; border-radius:14px; padding:28px 24px; max-width:320px; width:100%;
    text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .lock-box h2{ margin:0 0 4px; font-size:1.1rem; color:var(--texto); }
  .lock-box p{ margin:0 0 16px; font-size:.82rem; color:#647485; }
  .lock-box input{
    width:100%; text-align:center; font-size:1.4rem; letter-spacing:.3em;
    padding:10px; border:1px solid var(--gris-borde); border-radius:8px; margin-bottom:10px;
  }
  .lock-box button{ width:100%; }
  .lock-box .err{ color:#b3261e; font-size:.8rem; min-height:1.1em; margin-bottom:8px; }

  /* Estilos para impresión */
  @media print {
    header, .toolbar, #lockScreen { display: none !important; }
    body { background: #fff; }
    main { padding: 0; max-width: 100%; }
    .room { page-break-inside: avoid; border: 1px solid #000; margin: 10px 0; }
    .room-head { background: #eee !important; color: #000; }
    .room:has(.printChk:not(:checked)) { display: none !important; }
    .printChk { display: none; }
  }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>Acceso restringido</h2>
    <p>Introduce el PIN de la unidad para ver el relevo</p>
    <div class="err" id="lockErr"></div>
    <input type="password" inputmode="numeric" id="pinInput" maxlength="12" autocomplete="off">
    <button class="primary" id="btnUnlock">Entrar</button>
  </div>
</div>

<header>
  <div>
    <h1>Relevo Enfermería</h1>
    <div class="sub">Habitaciones 2301–2316</div>
  </div>
  <div class="sub" id="lastSync">Sin datos aún</div>
</header>

<div class="toolbar">
  <button class="primary" id="btnRefresh">↻ Actualizar</button>
  
  <!-- Selección por bloques -->
  <select id="selectBlock" class="btn-select">
    <option value="all">Marcar: Todas</option>
    <option value="b1">Bloque 2301 - 2308</option>
    <option value="b2">Bloque 2309 - 2316</option>
    <option value="none">Desmarcar todas</option>
  </select>

  <!-- Botón de impresión a PDF -->
  <button id="btnPrint">🖨️ Imprimir / PDF</button>

  <span id="status"></span>
</div>

<main id="rooms">
  <p style="text-align:center;color:#8a97a3;">Cargando habitaciones…</p>
</main>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwJsyd14emBOG8wTNHps1mtsi2bVqwXid85h_h3xvC9-7rSnRlXrLjiaqUC0mm7uog/exec';

const FIELD_LABELS = {
  nombre: 'Nombre (edad)',
  especialidad: 'Especialidad',
  jc: 'Juicio clínico',
  ap: 'Antecedentes personales',
  pte: 'Pendiente',
  otros: 'Otros'
};

const ESPECIALIDADES = ['', 'COT', 'CIR', 'MI', 'URO', 'NEU', 'DIG', 'CAR', 'OFT', 'DER', 'ORL', 'NEFR'];
const VIA_TIPOS = ['', 'VVP', 'VVC', 'VO', 'PICC', 'Reservorio'];

let roomsData = [];

function getPin(){ return sessionStorage.getItem('relevoPin') || ''; }

async function loadData(){
  setStatus('Cargando…', '');
  try{
    const response = await fetch(APPS_SCRIPT_URL + '?action=read&pin=' + encodeURIComponent(getPin()));
    const json = await response.json();

    if(!json.ok){
      if(json.error === 'PIN incorrecto'){
        sessionStorage.removeItem('relevoPin');
        showLock('PIN incorrecto. Inténtalo de nuevo.');
        return false;
      }
      throw new Error(json.error || 'Error desconocido al leer datos');
    }

    roomsData = json.data || [];
    render();
    setStatus('Actualizado', 'ok');
    document.getElementById('lastSync').textContent = 'Última actualización: ' + new Date().toLocaleTimeString('es-ES');
    return true;
  }catch(err){
    setStatus('Error: ' + err.message, 'err');
    return false;
  }
}

function showLock(errMsg){
  document.getElementById('lockScreen').classList.remove('hidden');
  document.getElementById('lockErr').textContent = errMsg || '';
  const input = document.getElementById('pinInput');
  input.value = '';
  setTimeout(() => input.focus(), 50);
}

function hideLock(){ document.getElementById('lockScreen').classList.add('hidden'); }

async function tryUnlock(){
  const pin = document.getElementById('pinInput').value.trim();
  if(!pin){ return; }
  sessionStorage.setItem('relevoPin', pin);
  document.getElementById('lockErr').textContent = '';
  const success = await loadData();
  if(success) hideLock();
}

document.getElementById('btnUnlock').addEventListener('click', tryUnlock);
document.getElementById('pinInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
document.getElementById('btnRefresh').addEventListener('click', loadData);

// Gestión de impresión y bloques
document.getElementById('btnPrint').addEventListener('click', () => window.print());

document.getElementById('selectBlock').addEventListener('change', (e) => {
  const mode = e.target.value;
  const roomElements = document.querySelectorAll('.room');

  roomElements.forEach(el => {
    const chk = el.querySelector('.printChk');
    const roomNum = parseInt(el.dataset.roomNumber, 10);
    if(!chk) return;

    if(mode === 'all') chk.checked = true;
    else if(mode === 'none') chk.checked = false;
    else if(mode === 'b1') chk.checked = (roomNum >= 2301 && roomNum <= 2308);
    else if(mode === 'b2') chk.checked = (roomNum >= 2309 && roomNum <= 2316);
  });
});

function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

function render(){
  const main = document.getElementById('rooms');
  main.innerHTML = '';

  if(!roomsData || roomsData.length === 0){
    main.innerHTML = '<p style="text-align:center;color:#8a97a3;">No hay habitaciones disponibles.</p>';
    return;
  }

  roomsData.forEach(room => {
    const div = document.createElement('div');
    div.className = 'room';
    
    const roomNumberStr = (room.roomL || '').replace(/[PV]$/,'');
    div.dataset.roomNumber = roomNumberStr;

    const head = document.createElement('div');
    head.className = 'room-head';
    head.innerHTML = `<label><input type="checkbox" class="printChk" checked> Hab. ${roomNumberStr}</label>`;
    div.appendChild(head);

    const bedsWrap = document.createElement('div');
    bedsWrap.className = 'beds';
    
    if(room.beds && Array.isArray(room.beds)){
      room.beds.forEach((bed, idx) => {
        const roomCode = idx === 0 ? room.roomL : (room.roomR || room.roomL);
        const isDouble = room.beds.length > 1;
        const bedLetter = isDouble ? (idx === 0 ? 'P' : 'V') : '·';
        bedsWrap.appendChild(renderBed(roomCode, bedLetter, bed));
      });
    }
    div.appendChild(bedsWrap);
    main.appendChild(div);
  });
}

function renderBed(roomCode, bedLetter, bed){
  bed = bed || {};
  const wrap = document.createElement('div');
  wrap.className = 'bed ' + (bedLetter === 'P' ? 'P' : bedLetter === 'V' ? 'V' : '');
  
  wrap.innerHTML = `
    <div class="bed-title">
      <div class="bed-number">
        <span>Hab. ${(roomCode || '').replace(/[PV]$/,'')}</span>
        ${bedLetter !== '·' ? `<span class="tag">${bedLetter}</span>` : ''}
      </div>
      <div class="header-nombre-box">
        <div class="rich-field inline-name" contenteditable="true" data-field="nombre" data-room="${roomCode}">${bed.nombre || ''}</div>
      </div>
      <select class="especialidad-select" data-field="especialidad" data-room="${roomCode}">
        ${ESPECIALIDADES.map(e => `<option value="${e}" ${bed.especialidad === e ? 'selected' : ''}>${e || 'Esp...'}</option>`).join('')}
      </select>
    </div>

    <div class="field">
      <label>${FIELD_LABELS.jc}</label>
      <div class="rich-field field-jc" contenteditable="true" data-field="jc" data-room="${roomCode}">${bed.jc || ''}</div>
    </div>

    <div class="field">
      <label>${FIELD_LABELS.ap}</label>
      <div class="rich-field field-ap" contenteditable="true" data-field="ap" data-room="${roomCode}">${bed.ap || ''}</div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Alergia</label>
        <select data-field="alergiaSiNo" data-room="${roomCode}">
          <option value="NO" ${bed.alergiaSiNo === 'NO' ? 'selected' : ''}>NO</option>
          <option value="SI" ${bed.alergiaSiNo === 'SI' ? 'selected' : ''}>SÍ</option>
        </select>
      </div>
      <div class="field">
        <label>Detalle Alergia</label>
        <input type="text" data-field="alergiaDetalle" data-room="${roomCode}" value="${bed.alergiaDetalle || ''}">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Vía</label>
        <select data-field="viaTipo" data-room="${roomCode}">
          ${VIA_TIPOS.map(v => `<option value="${v}" ${bed.viaTipo === v ? 'selected' : ''}>${v || 'Ninguna'}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Fecha Vía</label>
        <input type="text" class="date-input" data-field="viaFecha" data-room="${roomCode}" value="${bed.viaFecha || ''}" placeholder="dd/mm">
      </div>
    </div>

    <div class="field">
      <label>Constantes / Cuidados</label>
      <div class="sv-row">
        <div class="sv-group">
          <label class="sv-check"><input type="checkbox" data-field="svP" data-room="${roomCode}" ${bed.svP ? 'checked' : ''}> SV-P</label>
          <label class="sv-check"><input type="checkbox" data-field="svM" data-room="${roomCode}" ${bed.svM ? 'checked' : ''}> SV-M</label>
          <label class="sv-check"><input type="checkbox" data-field="svN" data-room="${roomCode}" ${bed.svN ? 'checked' : ''}> SV-N</label>
        </div>
        <div class="sv-group">
          <label class="sv-check"><input type="checkbox" data-field="cd" data-room="${roomCode}" ${bed.cd ? 'checked' : ''}> CD</label>
        </div>
      </div>
    </div>

    <div class="field">
      <label>${FIELD_LABELS.pte}</label>
      <div class="rich-field field-pte" contenteditable="true" data-field="pte" data-room="${roomCode}">${bed.pte || ''}</div>
    </div>

    <div class="field">
      <label>${FIELD_LABELS.otros}</label>
      <div class="rich-field field-otros" contenteditable="true" data-field="otros" data-room="${roomCode}">${bed.otros || ''}</div>
    </div>
  `;

  return wrap;
}

// Inicialización
if(getPin()){
  hideLock();
  loadData();
} else {
  showLock();
}
</script>
</body>
</html>
